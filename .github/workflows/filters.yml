# Rebuilds the rule lists every day and publishes them to GitHub Pages.
# In the app, set Filter server to https://<user>.github.io/<repo>/
#
# One-time setup: repo Settings › Pages › Source: "GitHub Actions".
name: Build filters

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/filters.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # macOS so the lists are checked and pruned with WebKit's real rule compiler.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Convert filter lists
        run: python3 tools/build_filters.py --out dist

      - name: Check every list compiles in WebKit
        run: swift tools/compile_check.swift dist/ads.json dist/privacy.json dist/annoyances.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
